name: Deploy to Coolify (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: The environment to deploy to
        type: string
      commit_sha:
        required: false
        description: Exact commit to deploy; mutually exclusive with tag
        default: ""
        type: string
      tag:
        required: false
        description: Optional git tag to deploy instead of the latest commit on main
        default: ""
        type: string
    secrets:
      PROTON_PASS_PERSONAL_ACCESS_TOKEN:
        description: Personal access token for Proton Pass CLI authentication.
        required: true
      PROTON_VAULT:
        description: Proton Pass vault containing the shared ci item.
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Proton Pass CLI
        uses: ./.github/actions/install-pass-cli

      - name: Resolve Coolify credentials from Proton Pass
        shell: bash
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
          PROTON_VAULT: ${{ secrets.PROTON_VAULT }}
        run: |
          set -euo pipefail

          pass-cli login --personal-access-token "$PROTON_PASS_PERSONAL_ACCESS_TOKEN" 

          for key in COOLIFY_URL COOLIFY_APP_UUID COOLIFY_TOKEN; do
            value="$(pass-cli item view "pass://${PROTON_VAULT}/ci/${key}" 2>/dev/null || true)"

            if [ -z "$value" ]; then
              echo "Missing ${key} in pass://${PROTON_VAULT}/ci"
              exit 1
            fi

            echo "::add-mask::$value"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Resolve version
        id: resolve
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          git fetch origin main --tags

          if [ -n "$COMMIT_SHA" ] && [ -n "$TAG" ]; then
            echo 'Specify either commit_sha or tag, not both.'
            exit 1
          fi

          if [ -n "$COMMIT_SHA" ]; then
            if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'commit_sha must be a full 40-character Git SHA.'
              exit 1
            fi
            sha="$(git rev-parse --verify "${COMMIT_SHA}^{commit}")"
            label="$sha"
          elif [ -n "$TAG" ]; then
            sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
            label="$TAG ($sha)"
          else
            sha="$(git rev-parse origin/main)"
            label="origin/main ($sha)"
          fi

          echo "COMMIT_SHA=${sha}" >> "$GITHUB_OUTPUT"
          echo "LABEL=${label}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${label}"

      - name: Update commit SHA in Coolify
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS -X PATCH \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"git_commit_sha\":\"${{ steps.resolve.outputs.COMMIT_SHA }}\"}"

      - name: Trigger build and deploy
        id: trigger
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl -fsS -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")"

          echo "Response: ${response}"

          deployment_uuid="$(echo "${response}" | jq -r '.deployments[0].deployment_uuid // empty')"

          if [ -z "$deployment_uuid" ]; then
            echo 'No deployment UUID in response.'
            exit 1
          fi

          echo "DEPLOYMENT_UUID=${deployment_uuid}" >> "$GITHUB_OUTPUT"
          echo "Deployment triggered: ${deployment_uuid}"
